name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    # Root in a container, so the iCloud tests can run a real IMAP server (Dovecot 2.3).
    container: ubuntu:24.04
    steps:
      - name: Install build tools, Dovecot and a keychain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config libssl-dev dovecot-imapd \
            gnome-keyring dbus
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Format
        working-directory: core
        run: cargo fmt --all --check
      - name: Lint
        working-directory: core
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        working-directory: core
        run: cargo test --workspace
      - name: Test the system keychain
        working-directory: core
        run: |
          dbus-run-session -- sh -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null \
            && cargo test -p mh-auth real_keychain -- --ignored'

  linux:
    name: Linux app (.deb for Ubuntu 26.04)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install build tools and Qt
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config libssl-dev dpkg-dev \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qtqml-workerscript libgl-dev xvfb xauth xdotool imagemagick fonts-noto-core \
            fonts-noto-color-emoji
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/linux
      - name: Build
        working-directory: apps/linux
        shell: bash
        # The app registrations are baked into the build. They are not secret
        # in the app (Google and Microsoft treat desktop apps as public
        # clients), but are kept out of the repository.
        env:
          MH_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MH_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MH_MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MH_MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
        run: |
          for v in MH_GOOGLE_CLIENT_ID MH_GOOGLE_CLIENT_SECRET MH_MS_CLIENT_ID MH_MS_TENANT_ID; do
            if [ -n "${!v}" ]; then echo "$v is set"; else echo "::warning::$v is missing, so that sign-in won't work in this build"; fi
          done
          cargo build --release --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Package
        working-directory: apps/linux
        run: cargo deb --no-build --deb-version "0.1.0~dev${{ github.run_number }}" -o ../../dist/
      - name: Screenshots
        working-directory: apps/linux
        run: |
          xvfb-run -a -s "-screen 0 1240x800x24" \
            ./packaging/screenshots.sh target/release/mailherd ../../dist/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: mailherd-deb
          path: dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: dist/screenshots/

  macos:
    name: Mac app (.dmg for Intel and Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        # The app registrations are baked in, as for Linux.
        env:
          MH_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MH_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MH_MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MH_MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
        run: apps/apple/build.sh "${{ github.run_number }}"
      - name: Screenshots
        run: apps/apple/screenshots.sh dist/MailHerd.app dist/mac-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: mailherd-mac
          path: dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mac-screenshots
          path: dist/mac-screenshots/
